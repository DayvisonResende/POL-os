<title>SISP Pol-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: estação de trabalho de repartição — papel de parede petróleo, janelas cinza-frio com barra de título azul-marinho, âmbar só para alerta e seleção. Tema único (é a tela de um PC). */
:root{
  color-scheme: light;
  --wall:#1d3640; --wall-2:#142a32; --wall-ink:#cfdcd9;
  --win:#e3e7e5; --pane:#f4f6f5; --edge:#9aa7a6; --rule:#c9d1cf;
  --ink:#172226; --ink-2:#4a5a5e; --ink-3:#6f7f82;
  --title:#22404c; --title-off:#7d9197; --title-ink:#f1f5f4;
  --accent:#d6951c; --accent-soft:#f6e3b8;
  --danger:#b0302a; --danger-soft:#f3d6d3; --ok:#2c7a4c; --ok-soft:#d4eadb;
  --code-bg:#0f191c; --code-ink:#cfe2dc; --code-kw:#e8b04a; --code-str:#93d39f; --code-num:#8db7ea; --code-com:#5f7a77; --code-sel:#2b4a52;
  --task:#0e1d22; --task-ink:#d5e2df;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-ui:"Barlow Semi Condensed","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --tbh:44px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wall-2);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
code{font-family:var(--f-code);font-size:.86em;background:var(--accent-soft);color:var(--ink);padding:0 .3em;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{position:fixed;inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0}

/* ---------- boot ---------- */
#boot{position:absolute;inset:0;z-index:9000;display:grid;place-items:center;padding:16px;
  background:radial-gradient(120% 90% at 30% 20%,#25454f 0%,var(--wall-2) 70%);color:var(--wall-ink)}
.boot-card{width:min(420px,100%);display:grid;gap:18px}
.crest{display:flex;align-items:center;gap:14px}
.crest svg{flex:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:.04em;line-height:.9;color:#eef3f1}
.brand small{display:block;font-size:15px;letter-spacing:.18em;color:#9fb6b3;font-weight:600;margin-top:6px}
.boot-form{background:rgba(8,20,24,.55);border:1px solid #3c5a62;padding:18px;display:grid;gap:12px}
.boot-form label{display:grid;gap:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#93aaa7}
.boot-form input{background:#0b1619;border:1px solid #3c5a62;color:#e6efed;padding:9px 10px;font-family:var(--f-code);font-size:14px}
.btn-primary{background:var(--accent);color:#1d1406;border:0;padding:10px 14px;font-weight:600;letter-spacing:.04em}
.btn-primary:disabled{opacity:.5;cursor:wait}
.boot-note{font-size:12.5px;color:#88a09d;line-height:1.5}
#bootStatus{font-family:var(--f-code);font-size:12px;color:#a6bcb9}

/* ---------- desktop ---------- */
#desk{position:absolute;inset:0 0 var(--tbh) 0;overflow:hidden;
  background:
    radial-gradient(90% 70% at 70% 30%,rgba(255,255,255,.05),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
    var(--wall)}
.wallmark{position:absolute;right:28px;bottom:22px;text-align:right;color:rgba(207,220,217,.22);font-family:var(--f-display);font-weight:700;font-size:64px;letter-spacing:.05em;line-height:.85;pointer-events:none;user-select:none}
.wallmark small{display:block;font-size:14px;letter-spacing:.3em}
#icons{position:absolute;top:14px;left:12px;display:grid;grid-auto-flow:row;gap:6px}
.dicon{width:88px;display:grid;justify-items:center;gap:4px;padding:6px 4px;background:none;border:1px solid transparent;color:#eaf1ef;font-size:13px;line-height:1.15;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.dicon:hover,.dicon:focus-visible{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.dicon .ico{width:40px;height:40px;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;text-shadow:none}

/* ---------- windows ---------- */
.win{position:absolute;background:var(--win);border:1px solid #5d6f73;box-shadow:0 12px 34px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.25) inset;display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:320px;min-height:220px}
.win.min{display:none}
.wtb{flex:none;height:30px;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;background:var(--title-off);color:var(--title-ink);cursor:move;user-select:none;touch-action:none}
.win.active .wtb{background:var(--title)}
.wtb .wt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px;letter-spacing:.02em}
.wtb button{width:26px;height:22px;border:0;background:rgba(255,255,255,.1);color:var(--title-ink);display:grid;place-items:center;font-size:13px;line-height:1}
.wtb button:hover{background:rgba(255,255,255,.22)}
.wtb button.x:hover{background:var(--danger)}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- taskbar ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tbh);background:var(--task);color:var(--task-ink);display:flex;align-items:center;gap:8px;padding:0 8px;border-top:1px solid #2b4148;z-index:8000}
#startBtn{flex:none;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1c3138;border:1px solid #33505a;color:#eaf1ef;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:16px}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.tbtn{flex:none;max-width:170px;height:32px;padding:0 10px;background:#18292f;border:1px solid #2b434a;color:#c9d8d5;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn.on{background:#2a4952;color:#fff;border-color:#4d727c}
.tray{flex:none;display:flex;align-items:center;gap:12px;font-size:12px}
.meter{display:grid;gap:3px;min-width:96px}
.meter .ml{display:flex;justify-content:space-between;gap:6px;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;color:#9db3b0;font-variant-numeric:tabular-nums}
.meter .bar{height:6px;background:#22363c;position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;transition:width .5s}
#mMetas .fill{background:#4fae76}
#mCorr .fill{background:#d24a3f}
#clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15;color:#e3ece9}
#clock small{display:block;color:#86a09c;font-size:10.5px}
#startMenu{position:absolute;left:8px;bottom:calc(var(--tbh) + 6px);width:250px;background:#132328;border:1px solid #33505a;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:8500;color:#dfe9e6;padding:6px}
#startMenu .smh{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;padding:8px 8px 10px;color:#9fb6b3;font-size:13px;border-bottom:1px solid #2b434a;margin-bottom:4px}
#startMenu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px;background:none;border:0;text-align:left;color:inherit}
#startMenu button:hover{background:#21393f}
#startMenu hr{border:0;border-top:1px solid #2b434a;margin:4px 0}

/* ---------- toasts ---------- */
#toasts{position:absolute;right:12px;bottom:calc(var(--tbh) + 12px);display:grid;gap:8px;z-index:8600;width:min(320px,calc(100% - 24px))}
.toast{background:#f7f9f8;color:var(--ink);border:1px solid var(--edge);border-left:4px solid var(--title);padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px;line-height:1.35;cursor:pointer;animation:tin .25s ease-out}
.toast b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--accent)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- shared bits ---------- */
.toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--win);border-bottom:1px solid var(--rule)}
.tb-btn{height:28px;padding:0 10px;background:var(--pane);border:1px solid var(--edge);display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.tb-btn:hover{background:#fff}
.tb-btn.run{background:var(--title);color:#fff;border-color:var(--title);font-weight:600}
.tb-btn.run:hover{background:#2d5260}
.kbd{font-family:var(--f-code);font-size:11px;opacity:.75}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ---------- DB-Investigator ---------- */
.dbwrap{flex:1;min-height:0;display:flex}
.dbmain{flex:1;min-width:0;display:flex;flex-direction:column}
.ed{position:relative;flex:none;height:150px;background:var(--code-bg);border-bottom:1px solid #000;resize:vertical;overflow:hidden;min-height:80px}
.ed pre,.ed textarea{position:absolute;inset:0;margin:0;padding:10px 12px;font-family:var(--f-code);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;border:0;overflow:auto}
.ed pre{color:var(--code-ink);pointer-events:none}
.ed textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none}
.ed textarea::selection{background:var(--code-sel);color:transparent}
.ed textarea::placeholder{color:var(--code-com)}
.k{color:var(--code-kw);font-weight:600}.s{color:var(--code-str)}.n{color:var(--code-num)}.c{color:var(--code-com);font-style:italic}
.status{flex:none;display:flex;gap:12px;align-items:center;padding:4px 10px;font-size:12.5px;color:var(--ink-2);background:var(--win);border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;min-height:26px}
.err{flex:none;margin:8px;padding:10px 12px;background:var(--danger-soft);border:1px solid #d9a19c;border-left:4px solid var(--danger);font-size:14px;line-height:1.45}
.err .raw{display:block;margin-top:6px;font-family:var(--f-code);font-size:11.5px;color:#7d3a35}
.hint0{flex:none;margin:8px;padding:9px 12px;background:var(--accent-soft);border-left:4px solid var(--accent);font-size:14px;line-height:1.45}
.grid{flex:1;min-height:0;overflow:auto;background:var(--pane)}
.grid table{border-collapse:collapse;font-family:var(--f-code);font-size:12.5px;min-width:100%}
.grid th{position:sticky;top:0;background:#d5dcda;text-align:left;padding:5px 10px;border-bottom:1px solid var(--edge);border-right:1px solid var(--rule);font-weight:600;white-space:nowrap;text-transform:uppercase;font-size:11.5px;letter-spacing:.04em}
.grid td{padding:4px 10px;border-bottom:1px solid #e1e6e4;border-right:1px solid #e9edec;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid tr:nth-child(even) td{background:#eef1f0}
.grid td.null{color:var(--ink-3);font-style:italic}
.grid td a{color:#1d5b8f;cursor:pointer;text-decoration:underline}
.grid .rn{color:var(--ink-3);text-align:right;background:#e6eae9!important}
.empty{padding:22px;color:var(--ink-3);font-size:14px;line-height:1.5;max-width:52ch}
.dict{flex:none;width:220px;border-left:1px solid var(--rule);background:var(--pane);overflow:auto;font-size:13px}
.dict h4{margin:0;padding:8px 10px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.dict details{border-bottom:1px solid var(--rule)}
.dict summary{padding:7px 10px;font-family:var(--f-code);font-weight:600;cursor:pointer}
.dict ul{list-style:none;margin:0;padding:0 0 6px}
.dict li button{display:flex;width:100%;gap:6px;align-items:baseline;padding:3px 10px 3px 18px;background:none;border:0;text-align:left;font-family:var(--f-code);font-size:12px}
.dict li button:hover{background:var(--accent-soft)}
.dict .ty{color:var(--ink-3);font-size:10.5px;margin-left:auto}
.dict .key{font-size:10px;font-weight:600;color:var(--title);border:1px solid var(--title);padding:0 3px}
.dict .note{padding:0 10px 4px 18px;font-size:11.5px;color:var(--ink-3);line-height:1.35}

/* ---------- Ocorrências ---------- */
.oc{flex:1;min-height:0;display:flex}
.oclist{flex:none;width:230px;border-right:1px solid var(--rule);background:var(--pane);overflow:auto}
.ocitem{display:grid;gap:3px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--rule);background:none}
.ocitem:hover:not(:disabled){background:#fff}
.ocitem.sel{background:#fff;box-shadow:inset 3px 0 0 var(--title)}
.ocitem:disabled{cursor:not-allowed;opacity:.55}
.ocitem .no{font-family:var(--f-code);font-size:11.5px;color:var(--ink-3)}
.ocitem .tt{font-weight:600;font-size:14.5px;line-height:1.2}
.pill{justify-self:start;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:2px 6px;border:1px solid}
.pill.p-open{color:#8a5a06;border-color:#d8a64a;background:var(--accent-soft)}
.pill.p-done{color:var(--ok);border-color:#8cc3a1;background:var(--ok-soft)}
.pill.p-lock{color:var(--ink-3);border-color:var(--rule)}
.ocdetail{flex:1;min-width:0;overflow:auto;padding:16px 18px 24px;background:#fbfcfb}
.bohead{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;padding:12px 14px;border:1px solid var(--rule);background:var(--pane);margin-bottom:14px}
.bohead div{display:grid;gap:2px;font-size:14px;min-width:0}
.bohead span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ocdetail h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0 0 4px;text-wrap:balance;line-height:1.05}
.ocdetail h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px;font-weight:600}
.relato{font-size:15px;line-height:1.55;max-width:68ch;margin:0}
.relato q{font-style:italic}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:72ch}
.step{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:9px 10px;border:1px solid var(--rule);background:var(--pane)}
.step .chk{width:18px;height:18px;border:1.5px solid var(--edge);display:grid;place-items:center;margin-top:1px;background:#fff}
.step.done{background:var(--ok-soft);border-color:#a9d1b7}
.step.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.step .st{font-size:14.5px;line-height:1.4}
.step .hb{grid-column:2;justify-self:start;background:none;border:0;padding:0;color:#1d5b8f;font-size:13px;text-decoration:underline}
.step .hint{grid-column:2;font-size:13.5px;line-height:1.45;color:var(--ink-2);background:#fff;border-left:3px solid var(--accent);padding:6px 9px}
.step .hint code{background:none;padding:0;color:#7a4d00}
.manual{max-width:72ch;border:1px solid var(--rule);background:var(--pane)}
.manual summary{padding:9px 12px;font-weight:600;cursor:pointer}
.manual .mb{padding:4px 14px 12px;font-size:14.5px;line-height:1.55}
.manual pre{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-code);font-size:12.5px;padding:8px 10px;overflow-x:auto;margin:6px 0 10px;white-space:pre}
.manual h5{margin:12px 0 2px;font-size:14px}
.final{max-width:72ch;border:2px solid var(--title);background:#fff;padding:14px;display:grid;gap:10px}
.final .ft{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:17px;color:var(--title)}
.final label{display:grid;gap:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.final input{padding:8px 10px;border:1px solid var(--edge);background:var(--pane);font-family:var(--f-code);font-size:14px;text-transform:none;letter-spacing:0}
.final .row{display:flex;gap:10px;flex-wrap:wrap}
.final .row label{flex:1 1 180px}
.verdict{padding:9px 12px;font-size:14px;line-height:1.45}
.verdict.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.verdict.bad{background:var(--danger-soft);border-left:4px solid var(--danger)}
.stamp{display:inline-block;transform:rotate(-4deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.12em;padding:2px 12px;margin:6px 0}

/* ---------- Chat ---------- */
.zap{flex:1;min-height:0;display:flex}
.contacts{flex:none;width:190px;border-right:1px solid var(--rule);background:var(--pane);overflow:auto}
.contact{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left}
.contact.sel{background:#fff;box-shadow:inset 3px 0 0 var(--title)}
.av{flex:none;width:34px;height:34px;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:var(--title)}
.av.beto{background:#7a5a2a}
.contact .cn{font-weight:600;font-size:14px;line-height:1.15}
.contact .cr{font-size:12px;color:var(--ink-3)}
.contact .badge{position:static;margin-left:auto}
.thread{flex:1;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#eef2f0}
.msg{max-width:80%;padding:8px 11px;font-size:14.5px;line-height:1.42;background:#fff;border:1px solid var(--rule);align-self:flex-start}
.msg.me{align-self:flex-end;background:#d9e7ea;border-color:#b6cdd3}
.msg.sys{align-self:center;background:none;border:0;color:var(--ink-3);font-size:12.5px;text-align:center}
.msg .who{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.reply{flex:none;border-top:1px solid var(--rule);padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:var(--win)}
.reply input{flex:1 1 140px;min-width:0;padding:7px 9px;border:1px solid var(--edge);background:#fff;font-family:var(--f-code)}
.reply .opt{padding:7px 10px;border:1px solid var(--edge);background:var(--pane);text-align:left;font-size:14px}
.reply .opt:hover{background:#fff}
.reply .muted{font-size:13px;padding:4px}

/* ---------- Files & viewers ---------- */
.files{flex:1;min-height:0;display:flex}
.tree{flex:none;width:170px;border-right:1px solid var(--rule);background:var(--pane);padding:6px 0;overflow:auto}
.tree button{display:block;width:100%;text-align:left;padding:6px 12px;border:0;background:none;font-size:14px}
.tree button.sel{background:#fff;box-shadow:inset 3px 0 0 var(--title);font-weight:600}
.flist{flex:1;min-width:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;align-content:start;background:#fbfcfb}
.file{display:grid;justify-items:center;gap:6px;padding:10px 6px;border:1px solid transparent;background:none;font-family:var(--f-code);font-size:12px;text-align:center;overflow-wrap:anywhere}
.file:hover,.file:focus-visible{background:var(--accent-soft);border-color:#e3c27d}
.path{flex:none;padding:5px 10px;font-family:var(--f-code);font-size:12px;background:var(--pane);border-bottom:1px solid var(--rule);color:var(--ink-2)}
.txtview{flex:1;overflow:auto;margin:0;padding:14px 16px;background:#fffef9;font-family:var(--f-code);font-size:13px;line-height:1.6;white-space:pre-wrap}
.photo{flex:1;min-height:0;display:grid;place-items:center;background:#050808;padding:8px}
.photo canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:9500;display:grid;place-items:center;padding:16px;background:rgba(5,12,14,.72)}
.report{width:min(560px,100%);max-height:100%;overflow:auto;background:#fbfcfb;border:1px solid var(--edge);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.report header{background:var(--title);color:#fff;padding:14px 18px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js"></script>
<script>
/*CORE-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sq(s){return "'"+String(s).replace(/'/g,"''")+"'"}

function buildSeedSQL(){
  var rnd=mulberry32(1042);
  var pick=function(a){return a[Math.floor(rnd()*a.length)]};
  var pad=function(n){return String(n).padStart(2,'0')};
  var LET='ABCDEFGHJKLMNPRSTUVWXYZ';
  var usedCpf=new Set(), usedPl=new Set();
  var people=[], vehicles=[], radar=[], catraca=[];
  function cpf(){var s;do{s=(100+Math.floor(rnd()*899))+'.'+(100+Math.floor(rnd()*899))+'.'+(100+Math.floor(rnd()*899))+'-'+pad(Math.floor(rnd()*99))}while(usedCpf.has(s));usedCpf.add(s);return s}
  var cidades=['Sorocaba','Votorantim','Itu','Salto','Piedade','Araçoiaba da Serra'];
  function person(nome,fixedCpf){var c=fixedCpf||cpf();usedCpf.add(c);var p={cpf:c,nome:nome,nasc:(1960+Math.floor(rnd()*44))+'-'+pad(1+Math.floor(rnd()*12))+'-'+pad(1+Math.floor(rnd()*28)),cidade:pick(cidades)};people.push(p);return p}
  function plate(){var p;do{p=pick(LET)+pick(LET)+pick(LET)+Math.floor(rnd()*10)+pick(LET)+Math.floor(rnd()*10)+Math.floor(rnd()*10)}while(usedPl.has(p)||/^(FTR|KZX|JKL|RTA|MNP|LMB|HBD)/.test(p));usedPl.add(p);return p}

  var planted=[
    ['FTR7A93','Virtus','prata',2021,'Denise Albuquerque Prado'],
    ['FTR2C41','Onix','branco',2020,'Gustavo Henrique Lemos'],
    ['FTR1D08','Corolla','preto',2019,'Patrícia Nogueira Sales'],
    ['FTR9B50','Kwid','vermelho',2022,'Lucas Ferraz Tavares'],
    ['KZX9B21','Hilux','preto',2023,'Valdemar Silveira'],
    ['JKL4A12','Corolla','preto',2022,'Renata Campos Vidal'],
    ['RTA8K02','S10','prata',2021,'Osvaldo Brito Menezes'],
    ['MNP3F77','Hilux','preto',2018,'Carlos Eduardo Paiva'],
    ['LMB6G55','Hilux','preto',2024,'Fernanda Rocha Bastos'],
    ['HBD2D44','HB20','preto',2017,'Igor Matsumoto']
  ];
  planted.forEach(function(v){usedPl.add(v[0])});
  planted.forEach(function(v){var p=person(v[4],v[0]==='KZX9B21'?'318.442.907-15':null);vehicles.push({placa:v[0],modelo:v[1],cor:v[2],ano:v[3],cpf:p.cpf})});

  var nomes=['Ana','Bruno','Camila','Diego','Eduarda','Felipe','Giovana','Heitor','Isabela','João','Karina','Leonardo','Mariana','Natália','Otávio','Priscila','Rafael','Sabrina','Tiago','Vanessa','Wesley','Yasmin','Rodrigo','Beatriz','Marcelo','Larissa','André','Tatiane'];
  var sobre=['Almeida','Barros','Cardoso','Duarte','Esteves','Fonseca','Gomes','Hirata','Junqueira','Leme','Moraes','Nakamura','Oliveira','Pires','Queiroz','Ribeiro','Siqueira','Toledo','Vasconcelos','Zanetti','Moreira','Santana'];
  var modelos=['Gol','Onix','HB20','Corolla','Civic','Compass','Renegade','Strada','Toro','Kwid','Mobi','Polo','T-Cross','Creta','Argo','Saveiro','Ranger','Tracker','Sandero','Fiorino'];
  var cores=['preto','prata','branco','vermelho','cinza','azul'];
  for(var i=0;i<38;i++){
    var p=(i>4&&rnd()<.18)?pick(people.slice(planted.length)):person(pick(nomes)+' '+pick(sobre)+' '+pick(sobre));
    var cor=i<6?cores[i]:pick(['preto','prata','branco','branco','prata','cinza','vermelho','azul','preto']);
    vehicles.push({placa:plate(),modelo:pick(modelos),cor:cor,ano:2008+Math.floor(rnd()*17),cpf:p.cpf});
  }
  for(i=0;i<6;i++)person(pick(nomes)+' '+pick(sobre)+' '+pick(sobre));

  var locais=[['Rod. Castelo Branco - Km 18','km18'],['Rod. Raposo Tavares - Km 92','km92'],['Av. Dom Aguirre','aguirre'],['Av. São Paulo','avsp']];
  var randV=vehicles.slice(planted.length);
  function stamp(min){var d=new Date(Date.UTC(2026,9,12,18,0,0)+min*60000+Math.floor(rnd()*60)*1000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())}
  for(i=0;i<72;i++){
    var loc=pick(locais), v=pick(randV), min=Math.floor(rnd()*780), ts=stamp(min);
    var sp=loc[1].indexOf('km')===0?70+Math.floor(rnd()*62):30+Math.floor(rnd()*45);
    var t=ts.slice(11);
    if(loc[1]==='km18'&&ts.slice(0,10)==='2026-10-12'&&t>='22:40:00'&&t<='23:20:00')sp=Math.min(sp,115);
    radar.push([v.placa,loc[0],ts,sp,'radar_'+loc[1]+'_'+ts.slice(11).replace(/:/g,'')+'.jpg']);
  }
  [['KZX9B21',0,'2026-10-12 22:58:14',154],['JKL4A12',0,'2026-10-12 22:51:40',128],['RTA8K02',0,'2026-10-12 23:09:03',139],
   ['MNP3F77',0,'2026-10-12 23:05:47',97],['LMB6G55',0,'2026-10-12 21:32:10',141],['HBD2D44',2,'2026-10-12 22:59:30',78],
   ['KZX9B21',1,'2026-10-12 23:41:02',112],['FTR7A93',3,'2026-10-12 19:31:22',64],['FTR2C41',2,'2026-10-12 19:24:05',52]
  ].forEach(function(r){var loc=locais[r[1]];radar.push([r[0],loc[0],r[2],r[3],'radar_'+loc[1]+'_'+r[2].slice(11).replace(/:/g,'')+'.jpg'])});
  radar.sort(function(a,b){return a[2]<b[2]?-1:1});

  var func=[['Roberto Silva','Investigador'],['Roberta Silva Lima','Escrivã'],['Célia Moura','Supervisora DTI'],['Jairo Teixeira','Agente'],['Marina Okada','Perita Criminal'],['Paulo Henrique Dias','Delegado'],['Sueli Ramos','Escrivã']];
  ['2026-10-08','2026-10-09','2026-10-12'].forEach(function(d){
    func.forEach(function(f){
      var e='0'+(7+(rnd()<.5?1:0))+':'+pad(rnd()<.5?Math.floor(rnd()*15):45+Math.floor(rnd()*14))+':'+pad(Math.floor(rnd()*60));
      if(e.slice(0,2)==='08'&&e.slice(3,5)>'40')e='07'+e.slice(2);
      var s=(rnd()<.5?'17:5':'18:0')+Math.floor(rnd()*10)+':'+pad(Math.floor(rnd()*60));
      if(f[0]==='Roberto Silva'&&d==='2026-10-12'){e='08:02:51';s='16:40:12'}
      catraca.push([f[0],f[1],d,e,s]);
    });
  });

  var sql=[];
  sql.push("CREATE TABLE pessoas (cpf TEXT PRIMARY KEY, nome TEXT NOT NULL, data_nascimento DATE, cidade TEXT);");
  sql.push("CREATE TABLE veiculos (placa TEXT PRIMARY KEY, modelo TEXT NOT NULL, cor TEXT NOT NULL, ano INTEGER, cpf_proprietario TEXT NOT NULL REFERENCES pessoas(cpf));");
  sql.push("CREATE TABLE leituras_radar (id INTEGER PRIMARY KEY AUTOINCREMENT, placa TEXT NOT NULL REFERENCES veiculos(placa), local_radar TEXT NOT NULL, data_hora DATETIME NOT NULL, velocidade_kmh INTEGER NOT NULL, foto_radar_url TEXT NOT NULL);");
  sql.push("CREATE TABLE catraca_acessos (id INTEGER PRIMARY KEY AUTOINCREMENT, funcionario TEXT NOT NULL, cargo TEXT NOT NULL, data DATE NOT NULL, horario_entrada TEXT NOT NULL, horario_saida TEXT NOT NULL);");

function condPt(ts){
  if(!ts.length||ts[0]==='(')return null;
  var c=ts[0],i=1,not=false;if(U(ts[i])==='NOT'){not=true;i++}
  var op=U(ts[i]),neg=not?' não ':' ';
  if(op==='LIKE')return colPt(c)+neg+likePt(ts[i+1]||"''");
  if(op==='BETWEEN'){var a=-1;for(var k=i+1;k<ts.length;k++)if(U(ts[k])==='AND'){a=k;break}if(a<0)return null;return colPt(c)+neg+'está entre '+valPt(ts.slice(i+1,a))+' e '+valPt(ts.slice(a+1))+' (incluindo os dois extremos)'}
  if(op==='IN'){var vals=[],cur=[],close=ts.lastIndexOf(')');ts.slice(i+2,close<0?ts.length:close).forEach(function(t){if(t===','){vals.push(cur);cur=[]}else cur.push(t)});if(cur.length)vals.push(cur);return colPt(c)+neg+'é um destes valores: '+listPt(vals.map(valPt))}
  if(op==='IS')return colPt(c)+(U(ts[i+1])==='NOT'?' está preenchida':' está vazia (NULL)');
  if(OPPT[op]&&ts.length>i+1)return colPt(c)+' '+OPPT[op]+' '+valPt(ts.slice(i+1));
  return null;
}
function splitConds(ts){var out=[],cur=[],d=0,conn=null,inB=false;ts.forEach(function(t){var u=U(t);if(t==='(')d++;if(t===')')d--;
  if(d===0&&(u==='AND'||u==='OR')){if(u==='AND'&&inB){inB=false;cur.push(t);return}out.push({conn:conn,ts:cur});cur=[];conn=u;return}
  if(u==='BETWEEN')inB=true;cur.push(t)});if(cur.length)out.push({conn:conn,ts:cur});return out}
function explainSQL(sql){
  var ts=tokSQL(sql);if(!ts.length)return {err:'O editor está vazio. Escreva uma consulta primeiro e depois peça a explicação.'};
  var semi=ts.indexOf(';'),extra=semi>=0&&semi<ts.length-1;if(semi>=0)ts=ts.slice(0,semi);
  if(U(ts[0])!=='SELECT')return {err:'Por enquanto eu só sei explicar consultas que começam com <code>SELECT</code>.'};
  var idx={},d=0;ts.forEach(function(t,i){if(t==='(')d++;else if(t===')')d--;else if(d===0){var u=U(t);
    if(u==='FROM'&&idx.FROM==null)idx.FROM=i;else if(u==='WHERE'&&idx.WHERE==null)idx.WHERE=i;else if(u==='ORDER'&&U(ts[i+1])==='BY'&&idx.ORDER==null)idx.ORDER=i;
    else if(u==='LIMIT'&&idx.LIMIT==null)idx.LIMIT=i;else if(u==='GROUP'&&idx.GROUP==null)idx.GROUP=i;else if(u==='HAVING'&&idx.HAVING==null)idx.HAVING=i}});
  var starts=Object.keys(idx).map(function(k){return [k,idx[k]]}).sort(function(a,b){return a[1]-b[1]});
  var end=function(k){var s0=idx[k];for(var j=0;j<starts.length;j++)if(starts[j][1]>s0)return starts[j][1];return ts.length};
  var selEnd=starts.length?starts[0][1]:ts.length,rows=[];
  var sel=ts.slice(1,selEnd),distinct=false;if(U(sel[0])==='DISTINCT'){distinct=true;sel=sel.slice(1)}
  var items=[],cur=[],dd=0;sel.forEach(function(t){if(t==='(')dd++;if(t===')')dd--;if(t===','&&dd===0){items.push(cur);cur=[]}else cur.push(t)});if(cur.length)items.push(cur);
  var itPt=items.map(function(it){if(!it.length)return '<i>(uma coluna em branco: sobrou uma vírgula?)</i>';var a=-1;it.forEach(function(t,k){if(U(t)==='AS')a=k});var expr=a>=0?it.slice(0,a):it,alias=a>=0?it[a+1]:null;
    if(a<0&&it.length===2&&/^[A-Za-z_]/.test(it[1])&&it[0]!=='*'){expr=[it[0]];alias=it[1]}
    var e=(expr.length===1&&expr[0]==='*')?'<b>todas as colunas</b>':expr.length===1?colPt(expr[0]):(U(expr[0])==='COUNT'?'a <b>contagem</b> de linhas':'o cálculo <code>'+escH(joinToks(expr))+'</code>');
    return e+(alias?', com o apelido <b>'+escH(String(alias).replace(/^["']|["']$/g,''))+'</b> no resultado':'')});
  rows.push({code:joinToks(ts.slice(0,selEnd)),pt:items.length?'Mostre '+(distinct?'<b>sem repetir</b> ':'')+listPt(itPt):'Mostre… o quê? Faltam as colunas depois do SELECT.'});
  if(idx.FROM==null)rows.push({code:'(sem FROM)',pt:'Falta dizer de qual tabela vêm os dados: <code>FROM nome_da_tabela</code>.'});
  else{var ft=ts.slice(idx.FROM,end('FROM')),tb=String(ft[1]||''),tk=tb.toLowerCase();
    rows.push({code:joinToks(ft),pt:!tb?'da tabela… qual? Falta o nome dela depois do FROM.':TABDESC[tk]?'da tabela <b>'+escH(tb)+'</b>, que é '+TABDESC[tk]:'da tabela <b>'+escH(tb)+'</b>. Atenção: essa tabela não existe no banco.'})}
  if(idx.WHERE!=null){splitConds(ts.slice(idx.WHERE+1,end('WHERE'))).forEach(function(c,k){var p=condPt(c.ts)||'a condição <code>'+escH(joinToks(c.ts))+'</code> for verdadeira';
    rows.push({code:(k===0?'WHERE ':c.conn+' ')+joinToks(c.ts),pt:k===0?'mas só as linhas em que '+p:(c.conn==='AND'?'<b>e também</b> ':'<b>ou então</b> ')+p})})}
  if(idx.GROUP!=null)rows.push({code:joinToks(ts.slice(idx.GROUP,end('GROUP'))),pt:'agrupando as linhas iguais (isso é assunto do Módulo 3)'});
  if(idx.HAVING!=null)rows.push({code:joinToks(ts.slice(idx.HAVING,end('HAVING'))),pt:'filtrando os grupos (assunto do Módulo 3)'});
  if(idx.ORDER!=null){var ob=ts.slice(idx.ORDER+2,end('ORDER')),parts=[],c2=[];ob.forEach(function(t){if(t===','){parts.push(c2);c2=[]}else c2.push(t)});if(c2.length)parts.push(c2);
    rows.push({code:joinToks(ts.slice(idx.ORDER,end('ORDER'))),pt:'em ordem de '+listPt(parts.map(function(pp){var dir=U(pp[pp.length-1]),col=(dir==='DESC'||dir==='ASC')?pp.slice(0,-1):pp;return colPt(joinToks(col))+(dir==='DESC'?', do maior para o menor':', do menor para o maior')}))})}
  if(idx.LIMIT!=null){var lt=ts.slice(idx.LIMIT,end('LIMIT'));rows.push({code:joinToks(lt),pt:lt[1]?'e mostre no máximo <b>'+escH(lt[1])+'</b> linha'+(lt[1]==='1'?'':'s'):'LIMIT precisa de um número depois. Exemplo: <code>LIMIT 5</code>'})}
  rows.push({code:';',pt:semi>=0?'Fim da consulta.':'Faltou o ponto e vírgula no fim. O banco aceita sem ele, mas é bom costume colocar.'});
  return {rows:rows,extra:extra};
}

  var out='',re=/(--[^\n]*)|('(?:[^']|'')*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g,m;
  while((m=re.exec(src))){

    else if(m[2])out+='<span class="s">'+escH(m[2])+'</span>';
    else if(m[3])out+='<span class="n">'+m[3]+'</span>';

}

  var ms=(performance.now()-t0).toFixed(1);var last=res.length?res[res.length-1]:null;save();

}

function provaMod(){if(S.rank===0&&caseDone(0))return 1;if(S.rank===1&&caseDone(2))return 2;return null}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function newProva(mod){var P=PROVAS[mod],m=shuffle(P.mcq).slice(0,3),w=shuffle(P.write).slice(0,2),ord={};
  m.forEach(function(q){ord[q.id]=shuffle([0,1,2])});
  S.prova={mod:mod,qs:m.map(function(q){return q.id}).concat(w.map(function(q){return q.id})),ord:ord,ans:{},sql:{},graded:null};save()}
function findQ(mod,id){var P=PROVAS[mod];return P.mcq.concat(P.write).filter(function(q){return q.id===id})[0]}
function runSafe(sql){if(!sql||!sql.trim())return {err:'Consulta vazia.'};if(!isReadOnly(sql))return {err:'Na prova só vale consulta de leitura (SELECT).'};
  try{var r=db.exec(sql);return {R:toR(r.length?r[r.length-1]:null),raw:r.length?r[r.length-1]:null}}catch(e){return {err:translateError(String(e.message||e),sql,SCHEMA),rawErr:String(e.message||e)}}}
function openProva(){openWin('prova',{title:'ACADEPOL — Avaliação',w:720,h:600,x:150,y:12,build:function(){renderProva()},refresh:function(){renderProva()}})}
function renderProva(){
  var r=WINS.prova;if(!r)return;var mod=provaMod();var b=r.body;var sc=b.querySelector('.prova');var top=sc?sc.scrollTop:0;b.innerHTML='';
  var wrap=h('div',{class:'prova'});b.appendChild(wrap);
  if(!mod){wrap.innerHTML='<div class="phead"><div class="eyebrow">Academia de Polícia Civil · ACADEPOL</div><h2>Nenhuma prova agendada</h2><p>'+(S.rank>=2?'Você já é '+escH(rankT())+'. A prova do Módulo 3 sai quando o módulo sair.':'A próxima prova é liberada quando você fechar os chamados do módulo.')+'</p></div>';return}
  if(!S.prova||S.prova.mod!==mod)newProva(mod);
  var P=PROVAS[mod],pv=S.prova,g=pv.graded;
  wrap.innerHTML='<div class="phead"><div class="eyebrow">Academia de Polícia Civil · ACADEPOL</div><h2>Prova de promoção a '+escH(RANKS[P.para].t)+'</h2><p>'+escH(P.titulo)+'. Cinco questões, aprovação com 4 acertos. A prova é com consulta: pode usar o DB-Investigator, o Dicionário de Dados e o botão Explique. Reprovou, refaz com outras questões.</p></div>';
  var body=h('div',{class:'pbody'});wrap.appendChild(body);
  if(g){var pass=g.score>=4;
    body.appendChild(h('div',{class:'score'},'<b>'+g.score+'/5</b><span class="stamp'+(pass?'':' bad')+'">'+(pass?'APROVADO':'REPROVADO')+'</span><span class="muted" style="flex:1;min-width:160px">'+(pass?'Promoção assinada pela supervisão.':'Leia as correções abaixo antes de refazer.')+'</span>'))}
  pv.qs.forEach(function(id,n){
    var q=findQ(mod,id),isW=!!q.check,res=g?g.res[id]:null;
    var box=h('div',{class:'pq'+(g?(res?' ok':' no'):'')});
    box.appendChild(h('div',{class:'qn'},'QUESTÃO '+(n+1)+(isW?' · ESCREVA A CONSULTA':' · MÚLTIPLA ESCOLHA')+(g?(res?' · CERTA':' · ERRADA'):'')));
    box.appendChild(h('div',{class:'qt'},q.q));
    if(q.code)box.appendChild(h('pre',null,escH(q.code)));
    if(!isW){
      pv.ord[id].forEach(function(oi){
        var picked=pv.ans[id]===oi,cls='opt'+(g&&oi===q.ok?' right':'')+(g&&picked&&oi!==q.ok?' wrongpick':'');
        var lab=h('label',{class:cls},'<input type="radio" name="q_'+id+'" id="q_'+id+'_'+oi+'"'+(picked?' checked':'')+(g?' disabled':'')+'><span>'+escH(q.opts[oi])+'</span>');
        if(!g)lab.querySelector('input').onchange=function(){pv.ans[id]=oi;save();updFoot()};
        box.appendChild(lab)});
    }else{
      var ta=h('textarea',{id:'pw_'+id,spellcheck:'false','aria-label':'Sua consulta para a questão '+(n+1),placeholder:'-- escreva aqui. Ex.: SELECT … FROM … ;'});ta.value=pv.sql[id]||'';if(g)ta.readOnly=true;
      var prev=h('div',{class:'prev'});
      ta.addEventListener('input',function(){pv.sql[id]=ta.value;save();updFoot()});
      box.appendChild(ta);
      if(!g){var tb=h('button',{class:'tb-btn',type:'button'},'&#9654; Testar consulta');tb.onclick=function(){
          var x=runSafe(ta.value);if(x.err){prev.innerHTML='<div class="err" style="margin:0">'+x.err+'</div>';return}
          var raw=x.raw;if(!raw){prev.innerHTML='A consulta rodou e não trouxe nenhuma linha.';return}
          prev.innerHTML=raw.values.length+' linha(s) · colunas: '+raw.columns.map(escH).join(', ')+'<table><tr>'+raw.columns.map(function(c){return '<th>'+escH(c)+'</th>'}).join('')+'</tr>'+raw.values.slice(0,3).map(function(row){return '<tr>'+row.map(function(v){return '<td>'+escH(v===null?'NULL':v)+'</td>'}).join('')+'</tr>'}).join('')+'</table>'+(raw.values.length>3?'…':'')};
        var ac=h('div',{class:'pfoot'});ac.appendChild(tb);box.appendChild(ac)}
      box.appendChild(prev);
    }
    if(g)box.appendChild(h('div',{class:'exp'},isW?(res?'Resultado correto.':'O resultado não bateu. Uma resposta possível:')+(res?'':'<pre style="margin-top:6px">'+escH(q.model)+'</pre>'):escH(q.exp)));
    body.appendChild(box)});
  var foot=h('div',{class:'pfoot'});body.appendChild(foot);
  function updFoot(){if(g)return;var done=pv.qs.filter(function(id){var q=findQ(mod,id);return q.check?(pv.sql[id]||'').trim():pv.ans[id]!=null}).length;
    foot.innerHTML='';var bt=h('button',{class:'btn-primary'},'Entregar prova');bt.disabled=done<5;bt.onclick=gradeProva;foot.appendChild(bt);foot.appendChild(h('span',{class:'muted'},done+' de 5 respondidas'))}
  if(g){var pass=g.score>=4;var bt=h('button',{class:'btn-primary'},pass?'Receber promoção':'Refazer com outras questões');
    bt.onclick=function(){if(pass){S.prova=null;save();promote(P.para)}else{newProva(mod);renderProva();wrap.scrollTop=0}};foot.appendChild(bt)}
  else updFoot();
  wrap.scrollTop=top;
}
function gradeProva(){
  var pv=S.prova,mod=pv.mod,res={},score=0;
  pv.qs.forEach(function(id){var q=findQ(mod,id),ok;
    if(q.check){var x=runSafe(pv.sql[id]);ok=!x.err&&q.check(x.R)}else ok=pv.ans[id]===q.ok;
    res[id]=!!ok;if(ok)score++});
  pv.graded={score:score,res:res};S.provaTries[mod]=(S.provaTries[mod]||0)+1;save();
  var t=S.provaTries[mod];
  if(score>=4)setTimeout(function(){say('celia',t===1?'Passou de primeira. Não vou elogiar, mas anotei.':'Passou. Demorou, mas passou. É isso que importa.')},700);
  else setTimeout(function(){say('celia',t===1?'Reprovou. Normal, metade reprova na primeira. Lê as correções com calma e refaz.':'De novo? Abre o Manual do recruta no SISP Ocorrências antes de refazer. Prova com consulta, recruta. Com consulta.')},700);
  renderProva();var w=WINS.prova&&WINS.prova.body.querySelector('.prova');if(w)w.scrollTop=0;
}
function promote(to){
  S.rank=to;save();buildStart();
  var R=RANKS[to],ov=h('div',{class:'overlay'});
  var stars='';for(var i=0;i<to;i++)stars+='<path transform="translate('+(i*30)+' 0)" d="M15 2l3.5 8.2 8.9.7-6.8 5.8 2.1 8.7L15 20.8l-7.7 4.6 2.1-8.7L2.6 10.9l8.9-.7z" fill="#d6951c"/>';
  ov.innerHTML='<div class="promo" role="dialog" aria-label="Promoção"><svg width="'+(to*30)+'" height="28" viewBox="0 0 '+(to*30)+' 28" aria-hidden="true">'+stars+'</svg><div class="eyebrow">Diário Oficial · DTI · Promoção</div><h2>'+escH(R.t)+'</h2><div class="muted">recruta.dti04, por aprovação na ACADEPOL</div><ul>'+R.libera.map(function(l){return '<li>'+escH(l)+'</li>'}).join('')+'</ul><q>'+escH(R.celia)+'</q><button class="btn-primary" id="prOk">Voltar ao trabalho</button></div>';
  $('#app').appendChild(ov);
  $('#prOk',ov).onclick=function(){ov.remove();say('celia',R.celia);
    if(to===1){unlockApp('files','Arquivos');S.caseSel=1;save();unlockToast();renderOcorr();renderFiles()}
    if(to===2){S.done=true;save();setTimeout(report,1500)}
    if(WINS.prova)renderProva();if(WINS.db)$('#dbStatus').textContent='Perfil: '+rankT()+' (somente leitura).'};
}

/* ---------- report / game over ---------- */
function report(){
  var ov=h('div',{class:'overlay'});
  var rows=CASES.map(function(c,i){return '<tr><td>BO 2026/'+c.id+' · '+escH(c.titulo)+'</td><td>'+(caseDone(i)?'encerrado':caseUnlocked(i)?'em análise':'pendente')+'</td></tr>'}).join('');
  ov.innerHTML='<div class="report"><header><h2>Relatório de Produtividade</h2><p>recruta.dti04 · '+escH(rankT())+' · terça-feira, 13/10/2026</p></header><div class="rb"><table>'+rows+
   '<tr><td>Consultas executadas</td><td>'+S.queries+'</td></tr><tr><td>Consultas com erro</td><td>'+S.errors+'</td></tr><tr><td>Metas</td><td>'+S.metas+'%</td></tr><tr><td>Corregedoria</td><td>'+S.corr+'%</td></tr></table>'+
   '<p>'+(S.done?'Promovido a Investigador Júnior. Você concluiu os Módulos 1 e 2: SELECT, colunas, DISTINCT, LIMIT, AS, WHERE, AND, LIKE, BETWEEN, IN e ORDER BY. O Módulo 3 (COUNT, SUM, GROUP BY, HAVING) ainda está em desenvolvimento.':'Ainda há chamados em aberto. Feche o relatório e volte ao trabalho.')+'</p>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-primary" id="rpClose">Voltar ao desktop</button><button class="tb-btn" id="rpReset">Recomeçar do zero</button></div></div></div>';
  $('#app').appendChild(ov);$('#rpClose',ov).onclick=function(){ov.remove()};$('#rpReset',ov).onclick=resetAll;
}
function fired(){
  var ov=h('div',{class:'overlay fired'});
  ov.innerHTML='<div class="report"><header><h2>ACESSO SUSPENSO</h2><p>Corregedoria Geral · Procedimento administrativo</p></header><div class="rb"><p>A auditoria interna atingiu 100%. Seu login foi bloqueado e o caso foi encaminhado à Corregedoria. Mandados indeferidos, informações erradas e favores fora do protocolo pesam no seu prontuário.</p><div><button class="btn-primary" id="frReset">Recomeçar o turno</button></div></div></div>';
  $('#app').appendChild(ov);$('#frReset',ov).onclick=resetAll;
}
function resetAll(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}

/* ---------- boot ---------- */
function startDesktop(resumed){
  $('#boot').hidden=true;renderIcons();buildStart();meters();
  $('#startBtn').onclick=function(e){e.stopPropagation();toggleStart()};
  document.addEventListener('click',function(e){if(!e.target.closest('#startMenu'))toggleStart(false)});
  if(tutActive()){var fresh=S.tut===0&&S.tutPhase==='doing'&&!S.editor;openDb();if(fresh)tutEnter()}
  else{openOcorr();if(S.closed.indexOf('1002')>=0&&S.beto==='none')setTimeout(startBeto,15000)}
  if(provaMod()&&S.apps.indexOf('prova')<0){S.apps.push('prova');save();renderIcons();buildStart()}
}
(function boot(){
  var resumed=load();
  $('#loginForm').addEventListener('submit',function(e){e.preventDefault();startDesktop(resumed)});
  if(typeof initSqlJs!=='function'){$('#bootStatus').textContent='Não consegui carregar o motor SQL (sql.js). Verifique a conexão e recarregue.';return}
  initSqlJs().then(function(lib){
    SQL=lib;db=new SQL.Database();db.run(buildSeedSQL());computeFacts(db);
    SCHEMA.tables=['veiculos','pessoas','leituras_radar','catraca_acessos'];SCHEMA.cols=[];
    SCHEMA.tables.forEach(function(t){var info=db.exec('PRAGMA table_info('+t+')')[0].values;var fks=(db.exec('PRAGMA foreign_key_list('+t+')')[0]||{values:[]}).values.map(function(v){return v[3]});
      SCHEMA.info[t]=info.map(function(c){SCHEMA.cols.push(c[1]);return {name:c[1],type:c[2],pk:!!c[5],fk:fks.indexOf(c[1])>=0}})});
    SCHEMA.cols=Array.from(new Set(SCHEMA.cols));
    $('#bootStatus').textContent=resumed?'Base carregada. Expediente anterior encontrado: seu progresso foi mantido.':'Base carregada: '+F.nVeic+' veículos no cadastro.';
    var b=$('#lgBtn');b.disabled=false;b.focus();
  }).catch(function(err){$('#bootStatus').textContent='Erro ao iniciar o banco: '+err})
})();
