<body>
<div id="app">
  <div id="boot">
    <div class="boot-card">
      <div class="crest">
        <img class="logo" src="img/logo.webp" width="142" height="180" alt="Pol-OS · Sistema de Operações e Investigações">
        <div class="brand"><small>SISP · ESTAÇÃO DTI-04</small></div>
      </div>
      <form class="boot-form" id="loginForm">
        <label for="lgUser"><span data-i18n>Usuário</span><input id="lgUser" value="recruta.dti04" autocomplete="off"></label>
        <label for="lgPass"><span data-i18n>Senha</span><input id="lgPass" type="password" value="cafe-frio-2026" autocomplete="off"></label>
        <button class="btn-primary" id="lgBtn" type="submit" disabled data-i18n>Iniciar expediente</button>
        <div id="bootStatus" data-i18n>Carregando base de dados…</div>
      </form>
      <p class="boot-note" data-i18n>Simulação fictícia para ensino de SQL. Nomes, placas e CPFs foram gerados e não correspondem a pessoas reais. Protótipo: Módulos 1 a 3 (cinco chamados).</p>
    </div>
  </div>

  <div id="desk">
    <div class="wallmark">SISP<small>POLÍCIA CIVIL · DTI</small></div>
    <div id="icons"></div>
    <div id="toasts"></div>
  </div>

  <div id="taskbar">
    <button id="startBtn" aria-haspopup="true" aria-expanded="false"><svg width="16" height="18" viewBox="0 0 58 66" aria-hidden="true"><path d="M29 2 54 11v20c0 16-10.5 27-25 33C14.5 58 4 47 4 31V11z" fill="#d6951c"/></svg><span>SISP</span></button>
    <div id="tasks"></div>
    <div class="tray">
      <div class="meter" id="mMetas" title="Metas de produtividade" data-i18n-title><div class="ml"><span data-i18n>Metas</span><b>0%</b></div><div class="bar"><div class="fill" style="width:0%"></div></div></div>
      <div class="meter" id="mCorr" title="Auditoria da Corregedoria" data-i18n-title><div class="ml"><span data-i18n>Corregedoria</span><b>0%</b></div><div class="bar"><div class="fill" style="width:0%"></div></div></div>
      <div id="clock">08:00<small>ter 13/10</small></div>
    </div>
  </div>
  <div id="startMenu" hidden></div>
  <div id="ptr" hidden aria-hidden="true"><span></span></div>
</div>
