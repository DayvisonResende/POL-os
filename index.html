<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISP Pol-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/apps/db-investigator.css">
<link rel="stylesheet" href="css/apps/ocorrencias.css">
<link rel="stylesheet" href="css/apps/policiazap.css">
<link rel="stylesheet" href="css/apps/arquivos.css">
<link rel="stylesheet" href="css/apps/treinamento.css">
<link rel="stylesheet" href="css/apps/acadepol.css">
<link rel="stylesheet" href="css/apps/diagnostico.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">
  <div id="boot">
    <div class="boot-card">
      <div class="crest">
        <svg width="58" height="66" viewBox="0 0 58 66" aria-hidden="true"><path d="M29 2 54 11v20c0 16-10.5 27-25 33C14.5 58 4 47 4 31V11z" fill="none" stroke="#d6951c" stroke-width="3"/><path d="M29 14l4 9.5 10 .8-7.6 6.5 2.3 9.8L29 35.4l-8.7 5.2 2.3-9.8L15 24.3l10-.8z" fill="#d6951c"/></svg>
        <div class="brand">POL-OS<small>SISP · ESTAÇÃO DTI-04</small></div>
      </div>
      <form class="boot-form" id="loginForm">
        <label for="lgUser">Usuário<input id="lgUser" value="recruta.dti04" autocomplete="off"></label>
        <label for="lgPass">Senha<input id="lgPass" type="password" value="cafe-frio-2026" autocomplete="off"></label>
        <button class="btn-primary" id="lgBtn" type="submit" disabled>Iniciar expediente</button>
        <div id="bootStatus">Carregando base de dados…</div>
      </form>
      <p class="boot-note">Simulação fictícia para ensino de SQL. Nomes, placas e CPFs foram gerados e não correspondem a pessoas reais. Protótipo: Módulos 1 e 2 (três chamados).</p>
    </div>
  </div>

  <div id="desk">
    <div class="wallmark">SISP<small>POLÍCIA CIVIL · DTI</small></div>
    <div id="icons"></div>
    <div id="toasts"></div>
  </div>

  <div id="taskbar">
    <button id="startBtn" aria-haspopup="true" aria-expanded="false"><svg width="16" height="18" viewBox="0 0 58 66" aria-hidden="true"><path d="M29 2 54 11v20c0 16-10.5 27-25 33C14.5 58 4 47 4 31V11z" fill="#d6951c"/></svg><span>SISP</span></button>
    <div id="tasks"></div>
    <div class="tray">
      <div class="meter" id="mMetas" title="Metas de produtividade"><div class="ml"><span>Metas</span><b>0%</b></div><div class="bar"><div class="fill" style="width:0%"></div></div></div>
      <div class="meter" id="mCorr" title="Auditoria da Corregedoria"><div class="ml"><span>Corregedoria</span><b>0%</b></div><div class="bar"><div class="fill" style="width:0%"></div></div></div>
      <div id="clock">08:00<small>ter 13/10</small></div>
    </div>
  </div>
  <div id="startMenu" hidden></div>
  <div id="ptr" hidden aria-hidden="true"><span></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js"></script>
<!-- Núcleo: lógica pura, sem DOM (também roda nos testes do Node) -->

<script src="js/core/sql/explicador.js"></script>
<!-- Conteúdo do jogo: casos, treinamento, provas, patentes, arquivos (sem DOM) -->
<script src="js/conteudo/personagens.js"></script>
<script src="js/conteudo/dicionario.js"></script>
<script src="js/conteudo/patentes.js"></script>
<script src="js/conteudo/arquivos.js"></script>

<!-- Interface base do Pol-OS -->
<script src="js/ui/dom.js"></script>

<!-- Aplicativos -->
<script src="js/apps/policiazap.js"></script>

<!-- História -->
<script src="js/historia/beto.js"></script>
<!-- Inicialização (sempre por último) -->
<script src="js/main.js"></script>
</body>
</html>
